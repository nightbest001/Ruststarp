[package]
name = "ruststrap"
version = "0.1.0"
edition = "2021"
description = "Ruststrap: a Rust port of Bloxstrap, an alternative Roblox bootstrapper"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "deflate", "brotli"] }
md-5 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
base64 = "0.22"
wry = "0.57"
tao = "0.37"
png = "0.17"
rfd = { version = "0.18.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
